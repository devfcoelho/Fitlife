<body style="font-family: Poppins">
    
    <nav>
    <a href="/index.html" class="logo">
        <i class="fas fa-heartbeat"></i>
        FitLife
      </a>
    <ul class="nav-links">
        <li><a class="nav-link" id="nav-active" href="../index.html">Home</a></li>

        <main>
            <section class="tool-container">
                <div class="tool-container-title">
                    <h2><i class="fas fa-fire"></i>Taxa metabólica Basal</h2>
                </div>

                <form>
                    

                    
                    <label for="gender">Gênero</label>
                    <select id="gender">
                        <option value="male">Masculino</option>
                        <option value="female">Feminino</option>
                    </select>

            
                    <div class="form-group">
                    <label for="weight">Peso</label>
                    <input type="Number" id="weight" placeholder="Ex: 70">
                    </div>

                    <div class="form-group">
                    <label for="height">Altura (cm)</label>
                    <input type="Number" id="height" placeholder="Ex: 175">
                    </div>

                    <div class="form-group">
                    <label for="weight">Idade (anos)</label>
                    <input type="Number" id="age" placeholder="Ex: 25">
                    </div>

                    <button class="action-btn" type="submit" onclick="calculateTMB(event)">Calcular Calorias</button>
                    <a class="action-btn btn-back" href="../index.html">Voltar</a>

                    </form>

                    <div id="result"  class="result-box">
                        <p>Gasto calórico basal</p>
                        <h2 id="tmb-value">0000</h2>
                        <p>Kcal/dia</p>
                    </div>
               
               


            </section>
            </main>
            <script src="/js/tmb.js"></script>
